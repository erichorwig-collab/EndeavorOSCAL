name: Validate v0.1 evidence adapter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install Python validators and release build toolchain
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-release-build.txt
      - name: Install pinned OSCAL validator
        run: npm ci
      - name: Run v0.1 validation suite
        run: python -m unittest discover -s tests -v
      - name: Run deterministic untrusted XML fuzz regression
        run: python scripts/fuzz-untrusted-xml.py --seed 20260831 --cases 24
      - name: Verify committed SBOM
        run: python scripts/generate-sbom.py --check sbom.cdx.json
      - name: Exercise representative alpha workflow
        run: python scripts/validate-alpha-workflow.py --record alpha-workflow-record.json
      - name: Retain alpha workflow manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpha-workflow-manifest
          path: alpha-workflow-record.json
          retention-days: 30
      - name: Validate governance-readiness evidence
        run: python scripts/validate-governance-readiness.py
