name: Validate v0.1 evidence adapter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install XML validator
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install pinned OSCAL validator
        run: npm ci
      - name: Run v0.1 validation suite
        run: python -m unittest discover -s tests -v
      - name: Verify committed SBOM
        run: python scripts/generate-sbom.py --check sbom.cdx.json
      - name: Exercise representative alpha workflow
        run: python scripts/validate-alpha-workflow.py
      - name: Validate governance-readiness evidence
        run: python scripts/validate-governance-readiness.py
