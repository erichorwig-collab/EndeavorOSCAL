name: OSV vulnerability inventory

on:
  schedule:
    - cron: '12 12 * * 1'
  workflow_dispatch:

jobs:
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.0
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
      fail-on-vuln: false
      upload-sarif: true
