name: Scan repository history for exposed secrets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The scan is entirely local to the checked-out repository. It has no token
# capable of writing repository data or contacting provider APIs.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the pinned Betterleaks release
        env:
          BETTERLEAKS_SHA256: efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/betterleaks"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/betterleaks/betterleaks.tar.gz" \
            https://github.com/betterleaks/betterleaks/releases/download/v1.8.1/betterleaks_1.8.1_linux_x64.tar.gz
          printf '%s  %s\n' "$BETTERLEAKS_SHA256" "$RUNNER_TEMP/betterleaks/betterleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/betterleaks/betterleaks.tar.gz" -C "$RUNNER_TEMP/betterleaks"
      - name: Scan complete Git history without live-secret validation
        # A clean environment prevents the scanner from inheriting runner
        # credentials. The scan does not enable validation or reports.
        run: env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" LANG=C.UTF-8 scripts/run-betterleaks.sh "$RUNNER_TEMP/betterleaks/betterleaks"
