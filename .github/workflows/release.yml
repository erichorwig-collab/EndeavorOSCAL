name: Publish attested release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.release-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Validation never needs the checkout token after this step.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install validators
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-release-build.txt
          npm ci
      - name: Validate frozen release source
        run: |
          python -m unittest discover -s tests -v
          python scripts/fuzz-untrusted-xml.py --seed 20260831 --cases 24
          python scripts/generate-sbom.py --check sbom.cdx.json
      - name: Validate alpha readiness evidence
        if: ${{ contains(github.ref_name, '-') }}
        run: |
          python scripts/validate-alpha-workflow.py --record alpha-workflow-record.json
          python scripts/validate-governance-readiness.py
      - name: Validate GA readiness evidence
        if: ${{ !contains(github.ref_name, '-') }}
        run: python scripts/validate-ga-release-readiness.py --tag "$GITHUB_REF_NAME" --candidate-commit "$GITHUB_SHA"
      - name: Scan GA source with OSV
        if: ${{ !contains(github.ref_name, '-') }}
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        continue-on-error: true
        with:
          scan-args: |-
            --output=osv-results.json
            --format=json
            --include-git-root
            -r
            ./
      - name: Enforce GA vulnerability dispositions
        if: ${{ !contains(github.ref_name, '-') }}
        run: python scripts/validate-ga-vulnerability-disposition.py --report osv-results.json
      - name: Build reproducible source and Python artifacts
        run: python scripts/build-release-source.py --version "${GITHUB_REF_NAME#v}" --ref "$GITHUB_SHA" --output-dir release
      - name: Clean-install Python distribution artifacts
        run: |
          python scripts/verify-python-distributions.py \
            --wheel release/*.whl \
            --sdist release/endeavor_oscal-*.tar.gz \
            --package-version "$(python -c \"import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])\")"
      - id: release-artifact
        name: Transfer checksummed release artifacts to publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Configure required reviewers for this environment before the first GA tag.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Retrieve the immutable build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
      - name: Verify artifact boundary before publication
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          test "$(find release -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 6
          test -z "$(find release -mindepth 1 -type l -print -quit)"
          (cd release && sha256sum --check --strict SHA256SUMS)
          python -c "import json, os, pathlib; manifest = json.loads(pathlib.Path('release/release-manifest.json').read_text(encoding='utf-8')); assert manifest['release-version'] == os.environ['RELEASE_VERSION'].removeprefix('v'); assert manifest['source-commit'] == os.environ['RELEASE_COMMIT']"
      - name: Attest published artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.whl
            release/SHA256SUMS
            release/sbom.cdx.json
            release/release-manifest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_NAME#*-}" != "$GITHUB_REF_NAME" ]; then
            gh release create "$GITHUB_REF_NAME" release/* --title "EndeavorOSCAL $GITHUB_REF_NAME" --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "EndeavorOSCAL $GITHUB_REF_NAME" --generate-notes --draft
          fi
